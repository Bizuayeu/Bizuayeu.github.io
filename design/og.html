<!doctype html>
<!--
  X などのリンクカード用の画像（1200×630）の原本。生大刀・生弓矢・天詔琴を幾何で描く。
  書き出し: msedge --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000
            --screenshot=public/og.png design/og.html
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&display=block"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@700&text=%E1%89%A5%E1%8B%99%20%E1%8A%A0%E1%8B%A8%E1%88%81&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f6f1e7;
      }
      svg {
        display: block;
      }
      .serif {
        font-family: 'Noto Serif JP', serif;
      }
      .ethiopic {
        font-family: 'Noto Serif Ethiopic', serif;
      }
    </style>
  </head>
  <body>
    <svg id="card" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
      <rect width="1200" height="630" fill="#f6f1e7" />
      <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#1d1a16" stroke-width="2" />
      <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#1d1a16" stroke-width="0.8" />
      <g id="emblem"></g>
      <g id="words">
        <text class="ethiopic" x="660" y="238" font-size="60" font-weight="700" fill="#a8322b">ብዙ አየሁ</text>
        <text class="serif" x="656" y="352" font-size="100" font-weight="900" fill="#1d1a16" letter-spacing="2">Bizuayeu</text>
        <line x1="662" y1="396" x2="1120" y2="396" stroke="#1d1a16" stroke-width="2" />
        <g class="serif" font-size="46" font-weight="900">
          <text x="662" y="472" fill="#7a5c0f">雷</text>
          <text x="760" y="472" fill="#4c5357">造</text>
          <text x="858" y="472" fill="#47652a">土</text>
          <text x="956" y="472" fill="#6a3d88">占</text>
          <text x="1054" y="472" fill="#23527c">織</text>
        </g>
      </g>
    </svg>
    <script>
      const SUMI = '#1d1a16';
      const KINARI = '#f6f1e7';
      const SHU = '#a8322b';
      const GOLD = '#d9b44a';
      const NS = 'http://www.w3.org/2000/svg';
      const g = document.getElementById('emblem');
      const el = (name, attrs) => {
        const e = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        g.appendChild(e);
        return e;
      };
      // 縁取り（生成りの太線を下に敷いて、重なりを切り分ける）
      const halo = (name, attrs, w = 6) =>
        el(name, { ...attrs, stroke: KINARI, 'stroke-width': (attrs['stroke-width'] ?? 0) + w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
      const f = (n) => n.toFixed(1);

      // 日輪
      el('circle', { cx: 330, cy: 250, r: 150, fill: SHU });

      // 天詔琴：上から見た古墳時代の琴。頭は細く、尾へ広がる板に五弦。
      // 弦は琴尾の五つの突起に留める（十三弦・柱の箏より前の形）
      const koto = { head: 70, tail: 540, cy: 520, hh: 32, th: 50 };
      el('path', {
        d: `M${koto.head},${koto.cy - koto.hh} L${koto.tail},${koto.cy - koto.th} L${koto.tail},${koto.cy + koto.th} L${koto.head},${koto.cy + koto.hh} Z`,
        fill: SUMI,
        stroke: SUMI,
        'stroke-width': 8,
        'stroke-linejoin': 'round',
      });
      for (let i = 0; i < 5; i++) {
        const yh = koto.cy + (i - 2) * 11; // 頭では寄り
        const yt = koto.cy + (i - 2) * 20; // 尾では突起ごとに開く
        el('rect', { x: koto.tail - 2, y: f(yt - 6), width: 30, height: 12, rx: 5, fill: SUMI });
        el('line', { x1: koto.head + 18, y1: f(yh), x2: koto.tail + 16, y2: f(yt), stroke: KINARI, 'stroke-width': 2 });
        el('circle', { cx: koto.tail + 16, cy: f(yt), r: 3, fill: GOLD });
      }
      // 頭の弦を束ねる帯
      el('rect', { x: koto.head + 10, y: koto.cy - 28, width: 7, height: 56, rx: 2, fill: GOLD });

      // 生弓矢：立てた弓。弦は左、弓は右へ張る。握りは下寄り（和弓の形）
      const bow = { x: 120, top: 72, bottom: 420 };
      const bowPath = `M${bow.x},${bow.top} C${bow.x + 120},${bow.top + 70} ${bow.x + 120},${bow.bottom - 70} ${bow.x},${bow.bottom}`;
      halo('path', { d: bowPath, fill: 'none', 'stroke-width': 10 });
      el('path', { d: bowPath, fill: 'none', stroke: SUMI, 'stroke-width': 10, 'stroke-linecap': 'round' });
      el('line', { x1: bow.x, y1: bow.top, x2: bow.x, y2: bow.bottom, stroke: SUMI, 'stroke-width': 2 });

      const ay = 300; // 矢の高さ
      const shaft = { x1: bow.x, x2: 520 };
      halo('line', { x1: shaft.x1, y1: ay, x2: shaft.x2, y2: ay, 'stroke-width': 5 });
      el('line', { x1: shaft.x1, y1: ay, x2: shaft.x2, y2: ay, stroke: SUMI, 'stroke-width': 5 });
      const head = `M${shaft.x2 - 4},${ay - 13} L${shaft.x2 + 46},${ay} L${shaft.x2 - 4},${ay + 13} Z`;
      halo('path', { d: head, fill: SUMI });
      el('path', { d: head, fill: SUMI });
      for (const s of [-1, 1]) {
        // 矢羽根：筈の側は立ち、前へ向かって細る
        const vane = `M${bow.x + 8},${ay} L${bow.x + 8},${ay + s * 17} L${bow.x + 34},${ay + s * 17} L${bow.x + 72},${ay} Z`;
        halo('path', { d: vane, fill: SUMI }, 4);
        el('path', { d: vane, fill: SUMI });
      }
      // 握り（弓と矢の交わり）
      el('rect', { x: 200, y: ay - 22, width: 16, height: 44, rx: 3, fill: SUMI });

      // 生大刀：古墳時代の直刀（反りなし・片刃）に環頭。柄を左下、切先を右上へ
      const H = { x: 250, y: 412 }; // 柄の端
      const T = { x: 548, y: 82 }; // 切先
      const L = Math.hypot(T.x - H.x, T.y - H.y);
      const u = { x: (T.x - H.x) / L, y: (T.y - H.y) / L };
      const n = { x: -u.y, y: u.x }; // 峰の側（左上）
      const at = (d, o = 0) => ({ x: H.x + u.x * d + n.x * o, y: H.y + u.y * d + n.y * o });
      const B = 100; // 鍔の位置（柄の端からの距離）
      const pt = (p) => `${f(p.x)},${f(p.y)}`;
      // 峰はまっすぐ切先へ、刃は切先の手前で斜めに上がる
      const blade = `M${pt(at(B, 7))} L${pt(at(L, 7))} L${pt(at(L - 38, -7))} L${pt(at(B, -7))} Z`;
      halo('path', { d: blade, fill: SUMI });
      el('path', { d: blade, fill: SUMI });
      el('line', { x1: f(at(B + 14, -2).x), y1: f(at(B + 14, -2).y), x2: f(at(L - 46, -2).x), y2: f(at(L - 46, -2).y), stroke: KINARI, 'stroke-width': 1.4, opacity: 0.8 });
      // 柄
      const hilt = `M${pt(at(0, 7))} L${pt(at(B - 6, 7))} L${pt(at(B - 6, -7))} L${pt(at(0, -7))} Z`;
      halo('path', { d: hilt, fill: SUMI });
      el('path', { d: hilt, fill: SUMI });
      for (const d of [22, 46, 70]) {
        const a = at(d - 2.5, 7), b = at(d + 2.5, 7), c = at(d + 2.5, -7), e = at(d - 2.5, -7);
        el('path', { d: `M${pt(a)} L${pt(b)} L${pt(c)} L${pt(e)} Z`, fill: GOLD });
      }
      // 環頭
      const ring = at(-15);
      halo('circle', { cx: f(ring.x), cy: f(ring.y), r: 15, fill: 'none', 'stroke-width': 7 });
      el('circle', { cx: f(ring.x), cy: f(ring.y), r: 15, fill: 'none', stroke: SUMI, 'stroke-width': 7 });
      // 鍔
      const tb = at(B - 3);
      const ang = (Math.atan2(u.y, u.x) * 180) / Math.PI;
      halo('ellipse', { cx: f(tb.x), cy: f(tb.y), rx: 6, ry: 22, transform: `rotate(${f(ang)} ${f(tb.x)} ${f(tb.y)})`, fill: SUMI });
      el('ellipse', { cx: f(tb.x), cy: f(tb.y), rx: 6, ry: 22, transform: `rotate(${f(ang)} ${f(tb.x)} ${f(tb.y)})`, fill: SUMI });
    </script>
  </body>
</html>
